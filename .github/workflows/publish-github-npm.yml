name: publish-github-npm

on:
  push:

permissions: read-all

jobs:
  publish:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bartoszosiej"
      - run: npm install
      - name: Publish (skip if version already exists)
        run: |
          PKG_NAME="@bartoszosiej/$(node -p "require('./package.json').name")"
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$VERSION already published — skipping"
            exit 0
          fi
          node -e "const p=require('./package.json');p.name='$PKG_NAME';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2));console.log('publishing',p.name+'@'+p.version)"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}