name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: echo "Building artifacts for ${{ github.ref_name }}"
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.0

      - name: Sign release artifacts
        if: github.event_name != 'pull_request'
        run: |
          for f in LICENSE README.md; do
            if [ -f "$f" ]; then
              cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.cert" "$f"
            fi
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            LICENSE
            README.md
          generate_release_notes: true
          draft: false
          prerelease: false
