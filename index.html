<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AURORA OS — a complete operating system in the browser. Built with TypeScript, zero dependencies." />
  <meta name="theme-color" content="#050505" />
  <title>AURORA OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="dist/style.css" />
  <link rel="stylesheet" href="https://bartoszosiej.github.io/css/aegis.css" />
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
        <defs>
          <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F15A24" />
            <stop offset="0.5" stop-color="#DA2C38" />
            <stop offset="1" stop-color="#8b95a8" />
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#bootg)" stroke-width="6" stroke-dasharray="326" stroke-dashoffset="326" id="boot-ring" />
        <path d="M38 74 L60 34 L82 74 Z" fill="url(#bootg)" />
      </svg>
    </div>
    <div class="boot-title">AURORA<span>OS</span></div>
    <div class="boot-progress"><div id="boot-bar"></div></div>
    <div id="boot-status" class="boot-status">Initializing kernel…</div>
  </div>

  <div id="desktop" hidden>
    <div id="wallpaper"></div>
    <div id="desktop-icons"></div>
    <div id="windows-layer"></div>
    <div id="taskbar">
      <button id="start-btn" class="tb-btn" title="Start">
        <span class="tb-logo">◈</span>
      </button>
      <div id="tb-apps"></div>
      <div id="tb-right">
        <button id="tb-wifi" class="tb-btn" title="Network">📶</button>
        <div id="tb-clock" class="tb-clock"></div>
      </div>
    </div>
    <div id="start-menu" hidden></div>
    <div id="context-menu" hidden></div>
  </div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
